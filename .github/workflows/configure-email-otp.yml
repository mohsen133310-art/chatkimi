name: Configure Supabase email OTP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure-email-otp:
    runs-on: ubuntu-latest
    steps:
      - name: Update Supabase Magic Link email template to show OTP
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: gegkwtxpygtfzyhnnrgv
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "::error::Missing SUPABASE_ACCESS_TOKEN repository secret."
            exit 1
          fi
          cat > payload.json <<'JSON'
          {
            "mailer_subjects_magic_link": "کد ورود شما به Kimi: {{ .Token }}",
            "mailer_templates_magic_link_content": "<div dir=\"rtl\" style=\"font-family:Arial,sans-serif;text-align:center;padding:24px\"><h2>کد تأیید Kimi</h2><p>برای ورود یا ثبت‌نام در Kimi از کد زیر استفاده کن:</p><div style=\"font-size:32px;font-weight:bold;letter-spacing:8px;padding:20px\">{{ .Token }}</div><p>این کد یک‌بارمصرف است. آن را در اختیار دیگران قرار نده.</p></div>"
          }
          JSON
          status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            --request PATCH \
            --url "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth" \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data @payload.json)
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Supabase API returned HTTP $status"
            cat response.json
            exit 1
          fi
          echo "Supabase email OTP template updated successfully."
